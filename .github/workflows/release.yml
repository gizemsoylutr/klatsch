name: release

# A published GitHub release publishes the npm package `klatsch`, after the author approves the `npm`
# environment. Two jobs: `build` checks the release and packs the tarball without any publishing right;
# `publish` only uploads that exact tarball. npm Trusted Publishing: the publish job proves who it is with a
# short-lived GitHub OIDC token, so there is no NPM_TOKEN anywhere, and npm attaches a provenance statement
# linking the package to this workflow run. A pre-release goes to the `next` dist-tag. Setup: docs/releasing.md.
on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: release-npm
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # All branches and history (origin/main among them), to check that the tag is on main.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: The release tag matches package.json and is on main
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "v$version" ]; then
            echo "Release tag $TAG does not match package.json version $version (expected v$version)." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tag $TAG ($GITHUB_SHA) is not on main." >&2
            exit 1
          fi
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run schema:check
      - run: npm test
      - run: npm run e2e
      # Builds dist/ and checks that the tarball holds exactly what it should (no sources, tests or deploy files).
      - run: npm run pack:check
      - id: pack
        run: |
          mkdir -p pack
          npm pack --ignore-scripts --pack-destination pack
          echo "tarball=$(cd pack && ls klatsch-*.tgz)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-tarball
          path: pack/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
    steps:
      # No checkout and no install: nothing from the repository runs in the job that can publish.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarball
          path: pack
      - name: Publish
        env:
          PRERELEASE: ${{ github.event.release.prerelease }}
          TARBALL: ${{ needs.build.outputs.tarball }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then tag=next; else tag=latest; fi
          npm publish "pack/$TARBALL" --provenance --access public --ignore-scripts --tag "$tag"
