name: deploy

# A published release (not a pre-release), or a manual run on main, builds the image, pushes it to GHCR
# and, after the author approves the `production` environment, rolls it out on the server over SSH.
# Repository setup: docs/self-hosting.md, "Deploying from GitHub Actions".
on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/gizemsoylutr/klatsch
  PUBLIC_URL: https://klatsch.dev

jobs:
  image:
    if: (github.event_name == 'release' && !github.event.release.prerelease) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

  deploy:
    needs: image
    if: (github.event_name == 'release' && !github.event.release.prerelease) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    # Required reviewer (the author) set on this environment in the repository settings; its secrets
    # are released only after approval.
    environment:
      name: production
      url: ${{ env.PUBLIC_URL }}
    permissions: {}
    steps:
      - name: Roll out over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          REF: ${{ env.IMAGE }}@${{ needs.image.outputs.digest }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # The server's host key, pinned: an unknown or changed key stops the deploy.
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The key may only run deploy/remote-deploy.sh on the server (forced command); the image digest is its only input.
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DEPLOY_USER@$DEPLOY_HOST" "$REF"
      - name: Check the relay answers
        run: curl --fail --silent --show-error --retry 10 --retry-delay 6 --retry-all-errors --max-time 10 "$PUBLIC_URL/" -o /dev/null
