name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run schema:check
      - run: npm run flows:check
      - run: npm test
      - run: npm run e2e
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:ui
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: ui-screenshots
          path: test/ui/screenshots/
          if-no-files-found: error
      # Builds dist/ and checks what `npm publish` would upload.
      - run: npm run pack:check
      - run: npm audit --audit-level=high

  # Secrets anywhere in the history, with Gitleaks' rules and Klatsch's token format (.gitleaks.toml).
  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # On a pull request the action lists its commits through the API.
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: false

  # Known vulnerabilities in every locked dependency, dev dependencies included (OSV database).
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --lockfile=package-lock.json
